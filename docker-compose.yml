services:
  users-api:
    build:
      context: ../FIAP-Cloud-Games
      dockerfile: src/FCG.Api/Dockerfile
    container_name: fcg-users-api
    ports:
      - "8081:8080"
    environment:
      - "ASPNETCORE_ENVIRONMENT=Development"
      - "ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=users;Username=fcg_user;Password=fcg_password"
      - "RabbitMQ__Host=rabbitmq"
      - "RabbitMQ__VirtualHost=/"
      - "RabbitMQ__Username=fcg_user"
      - "RabbitMQ__Password=fcg_password"
      - "Jwt__Issuer=FCGames"
      - "Jwt__Key=ChaveSuperSecretaECompridaDeExemplo123!"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "8082:8080"
    environment:
      - "ASPNETCORE_ENVIRONMENT=Development"
      - "ASPNETCORE_URLS=http://+:8080"
      - "ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=catalog;Username=fcg_user;Password=fcg_password"
      - "Jwt__Issuer=FCGames"
      - "Jwt__SigningKey=ChaveSuperSecretaECompridaDeExemplo123!"
      - "RabbitMQ__Host=rabbitmq"
      - "RabbitMQ__VirtualHost=/"
      - "RabbitMQ__Username=fcg_user"
      - "RabbitMQ__Password=fcg_password"
      - "Redis__ConnectionString=redis:6379"
      - "Redis__InstanceName=fcg:catalog:"
      - "Redis__DefaultTtlMinutes=15"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fcg-network

  postgres:
    image: postgres:15-alpine
    container_name: fcg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fcg_user
      POSTGRES_PASSWORD: fcg_password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: fcg-redis-commander
    ports:
      - "8085:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fcg-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fcg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fcg_user
      RABBITMQ_DEFAULT_PASS: fcg_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fcg-network

volumes:
  postgres_data:
  redis_data:

networks:
  fcg-network:
    driver: bridge
