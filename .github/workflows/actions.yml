name: Pipeline Infra

on:
  push:
    branches:
      - main
    tags:
      - 'v*' 

env:
  AWS_REPOSITORY: catalog-api
  NAMESPACE: fcg
  DEPLOYMENT_NAME: catalog-api
  CONTAINER_NAME: catalog-api


jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
        AWS_REGION: ${{vars.AWS_REGION}}
        CLUSTER_NAME: ${{vars.CLUSTER_NAME}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore FGC.Catalog.slnx

      - name: Build
        run: dotnet build FGC.Catalog.slnx --no-restore --configuration Release

      - name: Testar e gerar relatório
        run: dotnet test FGC.Catalog.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
      

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{vars.AWS_REGION}}
      
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, e push imagem docker no ECR
        if: startsWith(github.ref, 'refs/tags/') 
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.AWS_REPOSITORY}}
          IMAGE_VERSION_TAG: ${{ github.ref_name }}
        run: |
          CLEAN_TAG=$(echo $IMAGE_VERSION_TAG| sed 's/^v//')
          docker build -t $REGISTRY/$REPOSITORY:$CLEAN_TAG .
          docker push $REGISTRY/$REPOSITORY:$CLEAN_TAG

      
      - name: Deploy no EKS
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.AWS_REPOSITORY}}
          IMAGE_VERSION_TAG: ${{ github.ref_name }}
          DEPLOYMENT_NAME: ${{env.DEPLOYMENT_NAME}}
          CONTAINER_NAME: ${{env.CONTAINER_NAME}}
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic catalog-api-secret -n ${{ env.NAMESPACE }} \
          --from-literal=ConnectionStrings__DefaultConnection="Host=${{ secrets.DB_HOST }};Database=users;Username=${{ secrets.DB_USERNAME }};Password=${{ secrets.DB_PASSWORD }}" \
          --from-literal=MongoDB__ConnectionString="mongodb://${{secrets.MONGO_USER}}:${{secrets.MONGO_PASSWORD}}@${{secrets.MONGO_SERVER}}:${{secrets.MONGO_PORT}}/${{secrets.MONGO_DB}}?authSource=admin" \
          --from-literal=MongoDB__DatabaseName="${{secrets.MONGO_DB}}" \
          --from-literal=MongoDB__ReviewsCollectionName="${{secrets.MONGO_COLLECTION_REVIEWS_NAME}}" \
          --from-literal=Jwt__SigningKey="${{secrets.JWT_KEY}}" \
          --from-literal=Jwt__Issuer="${{secrets.JWT_ISSUER}}" \
          --from-literal=RabbitMQ__Host="${{ secrets.RABBITMQ_HOST }}" \
          --from-literal=RabbitMQ__VirtualHost="${{ secrets.RABBITMQ_VIRTUAL_HOST }}" \
          --from-literal=RabbitMQ__Username="${{ secrets.RABBITMQ_USERNAME }}" \
          --from-literal=RabbitMQ__Password="${{ secrets.RABBITMQ_PASSWORD }}" \
          --from-literal=Redis__ConnectionString="${{ secrets.REDIS_SERVER }}:${{secrets.REDIS_PORT}}" \
          --from-literal=Redis__InstanceName="${{ secrets.REDIS_INSTANCE_NAME}}" \
          --from-literal=Redis__DefaultTtlMinutes="${{ secrets.REDIS_TIMEOUT}}" \
          --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./k8s/
          kubectl set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$REGISTRY/$REPOSITORY:$CLEAN_TAG
          kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=120s

      - name: Publicando relatório de teste
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório de Testes C#
          path: TestResults/test-results.trx
          reporter: dotnet-trx